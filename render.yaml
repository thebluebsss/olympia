services:
  - type: web
    name: duong-len-dinh-olympia
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_OPTIONS
        value: --import tsx
